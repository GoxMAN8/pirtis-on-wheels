[project]
name = "pirtis"
version = "0.0.0"
description = "Pirtis on Wheels: the receptionist"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6",
]

[project.scripts]
harness = "pirtis.cmd.harness:main"
playground = "pirtis.playground.server:main"
gate-job = "pirtis.ops.gate_job:main"
calibrate = "pirtis.ops.calibrate:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest>=8",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pirtis"]

[tool.pytest.ini_options]
testpaths = ["pirtis"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the test-case page's prose and table rows: one line each reads and diffs better than wrapped
"pirtis/ops/fixture_doc.py" = ["E501"]

# strict on our code only; the kit's packages are type-checked as dependencies but
# their findings are not ours to fix
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["pirtis/agent", "pirtis/ops", "pirtis/playground"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pirtis.api.*",
    "pirtis.llm.*",
    "pirtis.harness.*",
    "pirtis.transcript.*",
    "pirtis.cmd.*",
    "pirtis.jsonutil",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true
